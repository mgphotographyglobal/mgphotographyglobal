[build]
  command = "npm run build"
  # No `publish` directory set on purpose: the site is no longer a static
  # export (blog content is now database-backed with on-demand
  # revalidation — see docs/BLOG_ADMIN_CHATGPT_WORK_AUTOMATION.md). Netlify
  # auto-detects the Next.js Runtime from the absence of output:"export"
  # in next.config.ts and manages build output/deployment itself; every
  # page with no dynamic data dependency is still served static/pre-rendered
  # exactly as before.

[build.environment]
  NODE_VERSION = "20"

# ─── Security Headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # NOTE: no blanket X-Robots-Tag here on purpose. Next.js already emits the
    # correct per-page <meta name="robots"> tag for every route (including
    # noindex on /landing/* and /newborn-photography-dubai/). A sitewide HTTP
    # header of "index, follow" would conflict with those noindex directives.

# ─── Image caching ────────────────────────────────────────────────────────────
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Redirects ────────────────────────────────────────────────────────────────
# Part 1: Canonical redirect — secondary URL → primary URL (301)
[[redirects]]
  from = "/newborn-photography-dubai"
  to = "/dubai-newborn-photography/"
  status = 301
  force = true

[[redirects]]
  from = "/newborn-photography-dubai/"
  to = "/dubai-newborn-photography/"
  status = 301
  force = true

# Retired duplicate: /blog/maternity-photoshoot-outfit-guide/ covered the same
# "what to wear for a maternity photoshoot" intent as the older, more complete
# /guides/what-to-wear-maternity-photoshoot/ page. The blog post was removed
# from content/blog/ (Phase 2.5 cleanup) in favour of the static guide, which
# is kept as the single canonical URL for this intent.
[[redirects]]
  from = "/blog/maternity-photoshoot-outfit-guide"
  to = "/guides/what-to-wear-maternity-photoshoot/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/maternity-photoshoot-outfit-guide/"
  to = "/guides/what-to-wear-maternity-photoshoot/"
  status = 301
  force = true

# Short-URL aliases now serve real content directly (see app/newborn-photography/page.tsx)
# — no redirect needed. A Netlify redirect here would silently override that fix for
# any direct/server-side visit (typed URL, external link, refresh), even though
# client-side navigation would correctly show the real content. Removed intentionally.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# NOTE: no SPA-fallback ("/* -> /index.html" status 200) rule here on purpose.
# The Next.js Runtime serves a real 404 for genuinely missing/mistyped URLs
# (including unknown blog slugs) — a catch-all fallback would turn those
# into soft-404s (200 status, homepage content) instead, which actively
# hurts crawlability.
